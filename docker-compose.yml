services:
  db:
    # Local Postgres for offline development and integration tests.
    image: postgres:16
    environment:
      POSTGRES_USER: wind
      POSTGRES_PASSWORD: wind
      POSTGRES_DB: wind
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wind -d wind"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    # DATABASE_URL comes from backend/.env (Supabase by default). To use the local db instead,
    # set DATABASE_URL=postgresql://wind:wind@db:5432/wind in backend/.env.
    env_file: backend/.env
    environment:
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
