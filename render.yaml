services:
  - type: web
    name: uk-wind-forecast-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.15
      - key: DATABASE_URL
        sync: false # set in the Render dashboard (Supabase Session pooler URI), never in the repo
      - key: CORS_ORIGINS
        sync: false # the Vercel URL, e.g. https://<project>.vercel.app
      - key: FORECAST_CUTOFF_TIME
        value: "10:00"
      - key: FORECAST_CUTOFF_DAYS_BEFORE
        value: "1"
      - key: DATA_MODE
        value: live
